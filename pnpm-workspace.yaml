packages:
  - "."
  - "preview-service/*"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# 1440 minutes is EXACTLY pnpm 11's own default, so this line changes no
# number. What it changes is the ENFORCEMENT MODEL, and that is the whole
# reason it is here: an EXPLICIT minimumReleaseAge turns on a whole-lockfile
# verification pass that the built-in default never runs. Measured 2026-08-11
# on pnpm 11.18.0, same tree, three runs of `pnpm install --frozen-lockfile`:
#
#   unset (the default)        no verification line at all
#   --config...=1440           OK Lockfile passes supply-chain policies (399 entries)
#   --config...=4320           X  Lockfile failed supply-chain policy check
#
# So without this line pnpm checks release age only at RESOLUTION time, and a
# lockfile that was resolved somewhere with the guard bypassed installs here
# without complaint. With it, all 399 entries are re-checked on every install,
# which is precisely the "someone committed a lockfile that bypassed the policy
# locally" case pnpm's own error text names. It also pins the floor against a
# future pnpm changing its default silently.
#
# DO NOT RAISE THIS ABOVE 1440 without reading the following. It was 4320
# (3 days) in the PR that added it, #184, and that made all seven CI jobs fail:
# the verification pass is RETROACTIVE, and this repo's lockfile contained
# `@speed-highlight/core@1.2.24` (published 2026-08-09, transitively via
# wrangler > miniflare > youch, landed by #169 on 2026-08-10 when it was ~1.2
# days old). Legal under the 24h floor it was resolved under, illegal under 3
# days, for the 2 days until it aged out. At 1440 that window cannot exist:
# pnpm's resolver already refuses anything younger than 24h, so no lockfile it
# produces can fail its own 24h verification. Any higher value re-opens a gap
# between what the resolver accepts and what the verifier demands.
#
# Two escape routes that look reasonable and are not:
#   - pnpm's own suggested fix, `pnpm clean --lockfile && pnpm install`, is a
#     full re-resolution. Measured on #184's branch: 357 changed lines, dragging
#     rolldown 1.1.5 > 1.2.3, @oxc-project/types 0.139.0 > 0.143.0, obug
#     2.1.3 > 2.1.4 and all 15 rolldown platform bindings. That is
#     `lockFileMaintenance`, which .github/renovate.json5 pins OFF because
#     transitive re-resolution is what triggered the TS2321 pathology in
#     vite.config.ts. Do not run it to clear an age violation.
#   - Raising the floor also breaks the security path. renovate.json5 sets
#     `vulnerabilityAlerts.minimumReleaseAge: "25 hours"` specifically to clear
#     pnpm's 24h floor with an hour to spare; at 4320 that value is inoperative
#     and every CVE fix waits 3 days. The two numbers are coupled - move one
#     and you must move the other.
#
# Renovate still enforces 3 days for everything it proposes (see the top of
# .github/renovate.json5). That is the layer where a longer soak belongs,
# because it gates what gets PROPOSED rather than re-judging what is already
# pinned. This line is the backstop for a hand-run `pnpm add`.
minimumReleaseAge: 1440
# There is no `overrides:` block on purpose. Until 2026-10-20 one pinned
# brace-expansion to a 2.x maintenance backport (2.1.3, then 2.1.4) for its DoS
# advisories. It came out because it had started breaking its only consumer:
# since @vue/test-utils 2.5.0 (#396) the path is js-beautify 2.0.3 >
# {editorconfig 3.0.2, glob 13.0.6} > minimatch 10.2.6, which declares
# `brace-expansion: ^5.0.8` and calls its named `expand` export. 2.x exports a
# bare function, so every minimatch brace pattern threw
# `TypeError: (0 , brace_expansion_1.expand) is not a function`. Nothing
# noticed, because `wrapper.html()` never reaches minimatch. Without the pin
# pnpm resolves 5.0.12, minimatch works, and `pnpm audit` has no brace-expansion
# line.
#
# Before pinning a transitive package again, read the declared range of EVERY
# parent that reaches it (`pnpm why <pkg>`), not only the one that motivated the
# pin. A pin that is right for one parent can silently break another.
