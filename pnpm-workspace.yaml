packages:
  - "."
  - "preview-service/*"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  # brace-expansion 2.1.2 has a DoS via unbounded expansion length: input like
  # `'{a,b}'.repeat(1500)` stays under the existing 100k result cap while making
  # every result ~1500 chars, so the accumulator exhausts memory and the process
  # crashes (CVE-2026-14257, GHSA-mh99-v99m-4gvg, CVSS 7.5). Reached dev/test
  # only, via @vue/test-utils > js-beautify > {editorconfig,glob} > minimatch,
  # so it never enters a deployed artifact and no attacker controls the input -
  # the patterns expanded are js-beautify's own. 2.1.3 is the maintenance
  # backport that adds a bounded accumulator; it is a drop-in (same CJS shape,
  # `main: index.js`, `balanced-match` its only dep). Deliberately NOT 5.0.8:
  # that is a three-major jump into a dual-ESM/CJS package being consumed by a
  # CJS minimatch@9.0.9, which is a spike, not a patch.
  #
  # This override does NOT clear the `pnpm audit` line, and that is expected.
  # The advisory declares one flat vulnerable range, `<=5.0.7`, with no
  # per-branch patched version, so 2.1.3 still matches it even though the code
  # carries the fix. Read the audit output, not the exit status.
  #
  # Nothing in this repo exercises js-beautify (`grep -rn "\.html(" test/`
  # returns nothing), so `pnpm run verify` passing is NOT evidence this bump is
  # safe. It was validated by hand instead: mounting a component through
  # @vue/test-utils and asserting `wrapper.html()` still returns sane markup.
  brace-expansion: "2.1.3"
